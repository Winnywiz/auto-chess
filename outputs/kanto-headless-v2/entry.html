  <!-- i18n antes de React: mismo orden que src/i18n/lang.ts (?lang= → localStorage 'kt-lang' → navigator.languages; resto → inglés).
       Idiomas: es, en, pt (pt-BR), ja. Al añadir uno, añadirlo también aquí (notes/l10n.md). -->
  <script>
    (function () {
      var C = ['es', 'en', 'pt', 'ja'], TAG = { pt: 'pt-BR' }, BOOT = { en: 'Loading…', pt: 'Carregando…', ja: '読み込み中…' };
      var ok = function (v) { v = String(v || '').toLowerCase(); if (v === 'pt-br') v = 'pt'; return C.indexOf(v) >= 0 ? v : null; };
      var l = null;
      try { l = ok(new URLSearchParams(location.search).get('lang')); } catch (e) {}
      if (!l) { try { l = ok(localStorage.getItem('kt-lang')); } catch (e) { l = null; } }
      if (!l) {
        l = 'en';
        var ls = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || ''];
        for (var i = 0; i < ls.length; i++) {
          var x = String(ls[i] || '').toLowerCase(), hit = null;
          for (var j = 0; j < C.length; j++) if (x === C[j] || x.indexOf(C[j] + '-') === 0) { hit = C[j]; break; }
          if (hit) { l = hit; break; }
        }
      }
      document.documentElement.lang = TAG[l] || l;
      if (l !== 'es') {
        document.title = 'Kanto Tactics';
        var b = document.querySelector('.boot-txt'); if (b) b.textContent = BOOT[l];
      }
    })();
  </script>
